<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ============================================================
         DÓNDE ESTÁ EL SEO DE ESTA PÁGINA
         ------------------------------------------------------------
         Aquí no hay título, descripción, Open Graph ni datos
         estructurados, y es intencional. Todo eso se genera desde
         `src/app/core/seo/` a partir del contenido real del doctor, y
         el prerender lo deja escrito en el HTML publicado antes de que
         ningún navegador ejecute nada.

         Motivo: escrito a mano aquí, se desincroniza. El día que el
         doctor corrija una especialidad o un número, la etiqueta meta
         seguiría diciendo lo viejo y nadie lo notaría, porque una meta
         desfasada no rompe ninguna pantalla.

         Para cambiar título, descripción o palabras clave:
             src/app/core/seo/site.config.ts
         Para cambiar el JSON-LD de Schema.org:
             src/app/core/seo/structured-data.ts

         Verificar el resultado tras `npm run build`:
             dist/landing/browser/index.html
         ============================================================ -->

    <!-- Solo queda aquí lo que debe llegar al navegador antes que el
         JavaScript: iconos, tipografías y la precarga del LCP. -->

    <!-- ============ Iconos ============
         Todos salen de `public/logo.png` vía `npm run media:brand`. Van
         sobre un disco blanco a propósito: el logo es azul oscuro sobre
         transparente y, sin fondo propio, desaparecía contra la barra de
         pestañas en tema oscuro y solo se veía un círculo gris. El fondo
         va recortado en círculo, no en cuadrado, porque la marca ya es
         circular y el lienzo cuadrado dejaba las esquinas blancas a la
         vista.

         El `.ico` va primero porque es el que el navegador pide solo
         (`/favicon.ico`) aunque no se declare; declararlo evita que se
         quede con una versión vieja en caché. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- ============ Tipografías ============
         Poppins construye la jerarquía visual y Open Sans mantiene
         cómoda la lectura de los textos informativos.

         `preconnect` abre la conexión TLS con Google Fonts mientras el
         navegador todavía lee el HTML, de modo que la petición de la
         hoja de estilos no empieza desde cero. Se declara una sola
         etiqueta `stylesheet`: la combinación anterior de `preload` +
         `stylesheet` descargaba el mismo archivo por dos caminos.

         MEJORA PENDIENTE: alojar las tipografías en /public elimina dos
         conexiones a un tercero del camino crítico y quita a Google
         Fonts del renderizado. Es la mayor mejora de LCP que queda. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
    />

    <!-- ============ Precarga del LCP ============
         El retrato del héroe es el elemento más grande sobre el
         pliegue, o sea el que define el LCP. Precargarlo lo saca de la
         cola: el navegador lo pide mientras todavía está leyendo el
         `<head>`, sin esperar a descubrirlo en el HTML.

         Apunta al AVIF, que es exactamente lo que el `<picture>` del
         héroe elegirá en cualquier navegador moderno; si apuntara al
         PNG se descargarían los dos. `type` hace que un navegador sin
         soporte AVIF ignore esta línea y descargue por la vía normal,
         en lugar de precargar un archivo que no va a usar. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="dr-fabio-palacios-cirujano-oncologo-piura-430w.avif"
      fetchpriority="high"
    />
  </head>

    </noscript>
  </body>
</html>
