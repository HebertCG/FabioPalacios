<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ============================================================
         DÓNDE ESTÁ EL SEO DE ESTA PÁGINA
         ------------------------------------------------------------
         Aquí no hay título, descripción, Open Graph ni datos
         estructurados, y es intencional. Todo eso se genera desde
         `src/app/core/seo/` a partir del contenido real del doctor, y
         el prerender lo deja escrito en el HTML publicado antes de que
         ningún navegador ejecute nada.

         Motivo: escrito a mano aquí, se desincroniza. El día que el
         doctor corrija una especialidad o un número, la etiqueta meta
         seguiría diciendo lo viejo y nadie lo notaría, porque una meta
         desfasada no rompe ninguna pantalla.

         Para cambiar título, descripción o palabras clave:
             src/app/core/seo/site.config.ts
         Para cambiar el JSON-LD de Schema.org:
             src/app/core/seo/structured-data.ts

         Verificar el resultado tras `npm run build`:
             dist/landing/browser/index.html
         ============================================================ -->

    <!-- Solo queda aquí lo que debe llegar al navegador antes que el
         JavaScript: iconos, tipografías y la precarga del LCP. -->

    <!-- ============ Iconos ============
         Todos salen de `public/logo.png` vía `npm run media:brand`. Van
         recortados en círculo y sin el margen del PNG original. Escalada
         tal cual, la marca quedaba flotando pequeña dentro del cuadro y
         su aro de texto se volvía ilegible: en la pestaña se leía como
         una bolita gris. Llenando el disco, el isotipo se distingue.

         El `.ico` va primero porque es el que el navegador pide solo
         (`/favicon.ico`) aunque no se declare; declararlo evita que se
         quede con una versión vieja en caché. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- ============ Tipografías ============
         Poppins construye la jerarquía visual y Open Sans mantiene
         cómoda la lectura de los textos informativos.

         Se sirven desde este mismo dominio (`public/fonts`, declaradas
         en `src/styles/_fonts.scss` y compiladas dentro de styles.css).
         Antes venían de Google Fonts, que costaba dos conexiones a un
         tercero en el camino crítico y encadenadas: el navegador no
         empezaba a bajar la fuente hasta que respondía la hoja de
         estilos remota. Ahora viajan por la conexión ya abierta.

         Regenerar tras cambiar pesos o familias: npm run media:fonts

         Solo se precargan las dos que pinta la primera pantalla —el
         titular en Poppins 700 y el cuerpo en Open Sans—. Precargar las
         ocho competiría con la imagen del héroe por el ancho de banda
         justo cuando se decide el LCP. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/poppins-latin-4.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/open-sans-latin-1.woff2"
      crossorigin
    />

    <!-- ============ Precarga del LCP ============
         El retrato del héroe es el elemento más grande sobre el
         pliegue, o sea el que define el LCP. Precargarlo lo saca de la
         cola: el navegador lo pide mientras todavía está leyendo el
         `<head>`, sin esperar a descubrirlo en el HTML.

         Apunta al AVIF, que es exactamente lo que el `<picture>` del
         héroe elegirá en cualquier navegador moderno; si apuntara al
         PNG se descargarían los dos. `type` hace que un navegador sin
         soporte AVIF ignore esta línea y descargue por la vía normal,
         en lugar de precargar un archivo que no va a usar. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="fabio/fabio-comunidad-portada-1600w.avif"
      imagesrcset="fabio/fabio-comunidad-portada-640w.avif 640w, fabio/fabio-comunidad-portada-1024w.avif 1024w, fabio/fabio-comunidad-portada-1600w.avif 1600w, fabio/fabio-comunidad-portada-2048w.avif 2048w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      Esta página necesita JavaScript activado. Si no puede verla, escriba al WhatsApp +51 906 418
      375 para conversar con Fabio Palacios o solicitar orientación para una consulta oncológica.
    </noscript>
  </body>
</html>
