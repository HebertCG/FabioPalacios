<div class="page page--tight">
  <p class="page__code" aria-hidden="true">404</p>

  <p class="page__eyebrow">Página no encontrada</p>
  <h1>Esta dirección no existe.</h1>
  <p class="page__lead">
    Puede que el enlace esté mal escrito o que la página haya cambiado de sitio.
  </p>

  <div class="page__actions">
    <a class="page__btn" routerLink="/">Ir al inicio <span aria-hidden="true">→</span></a>
    <a
      class="page__btn page__btn--green"
      [href]="medicalLink"
      target="_blank"
      rel="noopener noreferrer"
    >
      Consultar <span aria-hidden="true">↗</span>
    </a>
  </div>
</div>
