<!-- Atmósfera: halo de luz quirúrgica, retícula técnica y grano.
     Todo decorativo, todo fuera del árbol de accesibilidad. -->
<div class="atmosphere" aria-hidden="true">
  <span class="glow glow--main"></span>
  <span class="glow glow--rim"></span>
  <span class="grid"></span>
</div>

<div class="shell hero__grid">
  <!-- ---------------- Columna de texto ---------------- -->
  <div class="copy">
    <h1 id="titulo-inicio" class="display copy__title">
      <span class="copy__desktop-title">
        <span class="copy__title-line">{{ hero.titleStart }}</span>
        <span class="accent-word copy__title-line">{{ hero.titleAccent }}</span>
        <span class="copy__title-line">{{ hero.titleEnd }}</span>
      </span>
      <span class="copy__mobile-title">
        Cirugía oncológica
        <span class="accent-word">en el norte del Perú</span>
      </span>
    </h1>

    <p class="lead lead--light copy__lead">
      <span class="copy__desktop-lead">{{ hero.lead }}</span>
      <span class="copy__mobile-lead"> Alta complejidad, atención especializada y cercana. </span>
    </p>

    <div class="copy__actions">
      <a class="btn btn--primary" [href]="waLink" target="_blank" rel="noopener noreferrer">
        {{ hero.primaryCta }}
        <app-icon name="arrow-right" [strokeWidth]="2" />
      </a>
      <a class="btn btn--ghost-light" href="#especialidades">
        {{ hero.secondaryCta }}
      </a>
    </div>
  </div>

  <!-- ---------------- Columna del retrato ---------------- -->
  <div class="portrait">
    <span class="portrait__disc" aria-hidden="true"></span>
    <span class="portrait__ring" aria-hidden="true"></span>

    <!-- El navegador se queda con el primer formato que entienda.
         `fetchpriority="high"` y la ausencia de `loading="lazy"` son
         deliberadas: esta es la imagen más grande sobre el pliegue y
         debe empezar a descargarse de inmediato. La precarga de
         `index.html` apunta al mismo AVIF, así que no se descarga dos
         veces. -->
    <picture>
      <source [srcset]="portrait.avif" type="image/avif" />
      <source [srcset]="portrait.webp" type="image/webp" />
      <img
        class="portrait__img"
        [src]="portrait.fallback"
        width="430"
        height="497"
        fetchpriority="high"
        decoding="async"
        [alt]="
          doctor.displayName + ', ' + doctor.specialty + ' en Piura, revisando estudios de imágenes'
        "
      />
    </picture>
  </div>
</div>

<!-- Indicador de desplazamiento -->
<a class="scroll-hint" href="#formacion" aria-label="Ver más">
  <span class="scroll-hint__track" aria-hidden="true">
    <span class="scroll-hint__dot"></span>
  </span>
  <span class="scroll-hint__text">Desplácese</span>
</a>
