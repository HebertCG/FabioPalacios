<div class="shell faq__grid">
  <header class="head" appReveal>
    <p class="eyebrow">Preguntas frecuentes</p>
    <h2 id="titulo-preguntas" class="head__title">
      Lo que más
      <span class="accent-word accent-word--dark">me preguntan</span>
    </h2>
    <p class="lead head__lead">Si su duda no está acá, escríbame y se la respondo directamente.</p>

    <a class="btn btn--outline head__cta" [href]="waLink" target="_blank" rel="noopener noreferrer">
      <app-icon name="whatsapp" />
      Preguntar por WhatsApp
    </a>
  </header>

  <ul class="list">
    @for (faq of faqs; track faq.id; let i = $index) {
      @let isOpen = openId() === faq.id;
      <li class="item" [class.is-open]="isOpen" appReveal [revealDelay]="i * 55">
        <details [open]="isOpen">
          <summary (click)="toggle(faq.id, $event)">
            <h3>{{ faq.question }}</h3>
            <span class="item__sign" aria-hidden="true">
              <app-icon name="plus" [strokeWidth]="2" />
            </span>
          </summary>
          <div class="item__panel">
            <p>{{ faq.answer }}</p>
          </div>
        </details>
      </li>
    }
  </ul>
</div>
